<script>
    /* ---------- fatura em PDF (qualquer banco) + normalização de nomes ---------- */
    let NORM = [];   // regras globais vindas da aba Normalizacoes: { id, tipo: igual|prefixo|contem, padrao, nome, categoria }
    const NTIPO = { igual: 'Igual a', prefixo: 'Começa com', contem: 'Contém' };

    /* chave de comparação: sem caixa, acento, espaço, *, -, números (como a skill fazia) */
    const nkey = s => norm(s).replace(/[^a-z]/g, '');
    function findRule(raw) {
      const k = nkey(raw); if (!k) return null;
      const ord = { igual: 0, prefixo: 1, contem: 2 };
      const list = NORM.map(r => ({ r, k: nkey(r.padrao) })).filter(x => x.k && x.r.nome)
        .sort((a, b) => ord[a.r.tipo] - ord[b.r.tipo] || b.k.length - a.k.length);
      const hit = list.find(({ r, k: p }) => r.tipo === 'igual' ? k === p : r.tipo === 'prefixo' ? k.startsWith(p) : k.includes(p));
      return hit ? hit.r : null
    }

    /* parcela no fim da descrição: "PARC 03/10", "LOJA03/10", "— Parcela 3/10" */
    function splitParc(s) {
      const m = s.match(/\s*(?:[—–-]\s*)?(?:parc(?:ela)?\.?\s*)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\s*$/i);
      if (m && +m[1] >= 1 && +m[2] >= 2 && +m[1] <= +m[2] && +m[2] <= 48) return { base: s.slice(0, m.index).trim(), parc: `${+m[1]}/${+m[2]}` };
      return { base: s.trim(), parc: '' }
    }
    /* nome em CAIXA ALTA vira "Caixa Alta" para ficar legível */
    const pretty = s => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/(^|[\s*/.-])([a-zà-ú])/g, (_, a, b) => a + b.toUpperCase());

    /* descrição bruta -> { n: nome final, c: categoria da regra ou '' } */
    function finalName(raw) {
      const { base, parc } = splitParc(String(raw).replace(/\s{2,}/g, ' '));
      const r = findRule(base);
      /* sem regra: tira o intermediário de pagamento do começo ("MP *SHELLBOX" -> "Shellbox") */
      const n = (r ? r.nome : pretty(base.replace(/\s*(USD|US\$|EUR|R\$)\s*$/i, '').replace(/^(mp|pag|pg|dl|cappta|sumup|pagseguro|ps|ec|zp)\s*\*\s*(?=\S)/i, ''))) || base;
      return { n: parc ? `${n} — Parcela ${parc}` : n, c: r && r.categoria ? r.categoria : '' }
    }

    /* ---------- pdf.js sob demanda ---------- */
    const PDFJS = window.PDFJS_BASE || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    let pdfjsP = null;
    function loadPdfjs() {
      return pdfjsP || (pdfjsP = new Promise((ok, ko) => {
        const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
        s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib) };
        s.onerror = () => { pdfjsP = null; ko(new Error('não foi possível carregar o leitor de PDF')) };
        document.head.appendChild(s)
      }))
    }
    /* texto do PDF em linhas: itens com a mesma altura (y) viram uma linha; espaços grandes viram "   " */
    async function pdfLines(buf) {
      const lib = await loadPdfjs(), task = lib.getDocument({ data: buf });
      task.onPassword = (cb, why) => { const p = prompt(why === 2 ? 'Senha incorreta. Digite a senha do PDF:' : 'Este PDF tem senha. Digite a senha:'); if (p == null) task.destroy(); else cb(p) };
      const doc = await task.promise, out = [];
      for (let p = 1; p <= doc.numPages; p++) {
        const tc = await (await doc.getPage(p)).getTextContent(), rows = [];
        tc.items.forEach(it => {
          if (!it.str || !it.str.trim()) return;
          const x = it.transform[4], y = it.transform[5];
          let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) rows.push(r = { y, its: [] });
          r.its.push({ x, s: it.str, e: x + it.width })
        });
        rows.sort((a, b) => b.y - a.y).forEach(r => {
          r.its.sort((a, b) => a.x - b.x); let s = '', end = null;
          r.its.forEach(i => { if (end != null) { const gap = i.x - end; s += gap > 12 ? '   ' : gap > 1 ? ' ' : '' } s += i.s; end = i.e });
          s = s.trim(); if (s) out.push(s)
        })
      }
      return out
    }

    /* ---------- leitura genérica dos lançamentos ---------- */
    const MESAB = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
    const F_DATE = /^(\d{2})[\/.-](\d{2})(?:[\/.-]\d{2,4})?\s+|^(\d{1,2})\s*(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s*\/?\s*\d{2,4})?\s+/i;
    const F_MONEY = /([-−](?=\s?R\$|\d))?(?:R\$\s*)?([-−](?=\d))?\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)([-−](?!\S))?/g;
    /* calibráveis por banco */
    const F_STOP = /pr[oó]ximas faturas|lan[cç]amentos futuros|compras parceladas\s*-\s*pr[oó]xima|demais faturas/i;
    const F_START = /^transa[cç][oõ]es\b|^lan[cç]amentos\b(?!\s*futuros)/i;   // volta a ler depois de um F_STOP (Nubank: resumo de próximas faturas vem antes das transações)
    const F_TOTCOMPRAS = /total de compras|total dos? lan[cç]amentos/i;      // preferido: não inclui saldo/crédito da fatura anterior
    const F_TOTAL = /total (desta|da) fatura|valor total (desta|da) fatura|total a pagar|valor desta fatura/i;
    const F_SKIP = /\b(total|subtotal|saldo|limite|pagamento m[ií]nimo|valor m[ií]nimo|fatura anterior)\b/i;
    const F_CRED = /pagamento|estorno|cr[eé]dito|devolu[cç][aã]o|reembolso|cashback/i;
    const F_CARD = /[•·*]{2,}\s*\d{4}\s*/g;   // final do cartão mascarado ("•••• 1327")

    function parseFatura(lines) {
      const L = learned(), rows = [], bad = [];
      let totC = null, totF = null, stop = false;
      for (const line of lines) {
        const all = [...line.matchAll(F_MONEY)], one = all.length === 1 ? parseBR(all[0][0].replace(/[-−]/g, '')) : null;
        if (one != null && totC == null && F_TOTCOMPRAS.test(line)) totC = one;
        if (one != null && totF == null && F_TOTAL.test(line)) totF = one;   // linhas com vários valores são simulações de parcelamento
        if (F_STOP.test(line)) stop = true; else if (F_START.test(line)) stop = false;
        if (stop) continue;
        /* cada valor fecha um trecho; trecho que começa com data é um lançamento (cobre faturas em duas colunas) */
        let from = 0; const mm = [...line.matchAll(F_MONEY)];
        for (let i = 0; i < mm.length; i++) {
          let j = i; while (j + 1 < mm.length && !line.slice(mm[j].index + mm[j][0].length, mm[j + 1].index).trim()) j++;
          const seg = line.slice(from, mm[i].index).trim(), m = mm[j];
          from = m.index + m[0].length; i = j;
          const dm = seg.match(F_DATE); if (!dm) continue;
          const d = dm[1] ? `${dm[1]}/${dm[2]}` : `${String(dm[3]).padStart(2, '0')}/${String(MESAB[dm[4].toLowerCase()]).padStart(2, '0')}`;
          const raw = seg.slice(dm[0].length).replace(F_CARD, ' ').replace(/\s*(USD|US\$|EUR|R\$)\s*$/i, '').replace(/\s{2,}/g, ' ').trim();
          if (!raw || F_SKIP.test(raw)) continue;
          let v = parseBR(m[0].replace(/[-−]/g, '')); if (v == null) continue;
          if (/[-−]/.test(m[0])) v = -v;
          if (v < 0 || F_CRED.test(raw)) { bad.push(`${d}  ${raw}  ${nf.format(v)}`); continue }
          const f = finalName(raw), c = f.c || guess(f.n, L);
          rows.push({ n: f.n.slice(0, 80), d, v: r2(v), c, auto: !f.c, raw })
        }
      }
      return { rows, bad, decl: totC != null ? totC : totF, badLbl: 'créditos, pagamentos e estornos (fora da soma)' }
    }

    /* ---------- sessão "Normalizações": cadastro das regras (salvas na hora na aba Normalizacoes) ---------- */
    let normTimer = null, normDraft = null;
    const normCats = cur => ['', ...ALLCATS, ...(cur && !ALLCATS.includes(cur) ? [cur] : [])].map(c => `<option value="${esc(c)}"${c === (cur || '') ? ' selected' : ''}>${c ? esc(c) : '— automática —'}</option>`).join('');
    const normTipos = cur => Object.entries(NTIPO).map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${l}</option>`).join('');
    function normHTML() {
      const d = normDraft || { tipo: 'contem', padrao: '', nome: '', categoria: '' };
      const list = NORM.slice().sort((a, b) => norm(a.nome).localeCompare(norm(b.nome)) || norm(a.padrao).localeCompare(norm(b.padrao)));
      return `<section class="pane npane"><header><h4>Regras <span>${NORM.length}</span></h4><p>Quando a descrição da fatura bate com o texto, o lançamento recebe o nome final (e a categoria, se escolhida). Maiúsculas, acentos, espaços, * , - e números são ignorados na comparação.</p></header>
<div class="newcat nrow"><select id="nwT" aria-label="Tipo da nova regra">${normTipos(d.tipo)}</select><input type="text" id="nwP" maxlength="80" placeholder="Texto na fatura (ex.: MERCADOLIVRE)" value="${esc(d.padrao)}" autocomplete="off" aria-label="Texto na fatura"><input type="text" id="nwN" maxlength="80" placeholder="Nome final (ex.: Mercado Livre)" value="${esc(d.nome)}" autocomplete="off" aria-label="Nome final"><select id="nwC" aria-label="Categoria da nova regra">${normCats(d.categoria)}</select><button class="btn primary sm" data-act="normAdd"><svg class="i" aria-hidden="true"><use href="#i-plus" /></svg>Criar</button></div>
<div class="ntest"><label for="nTest">Testar</label><input type="text" id="nTest" placeholder="Cole uma descrição da fatura, ex.: MERCADOLIVRE*LOJASCOI 03/10" autocomplete="off"><span id="nTestR" aria-live="polite"></span></div>
<div class="plist">${list.length ? list.map(r => `<div class="item nrow"><select data-rt="${r.id}" aria-label="Tipo">${normTipos(r.tipo)}</select><input type="text" data-rp="${r.id}" value="${esc(r.padrao)}" maxlength="80" aria-label="Texto na fatura"><input type="text" data-rn="${r.id}" value="${esc(r.nome)}" maxlength="80" aria-label="Nome final"><select data-rcat="${r.id}" aria-label="Categoria">${normCats(r.categoria)}</select><button class="x" data-act="normDel" data-id="${r.id}" aria-label="Excluir regra ${esc(r.padrao)}"><svg class="i" aria-hidden="true"><use href="#i-trash" /></svg></button></div>`).join('') : '<div class="empty">Nenhuma regra ainda.</div>'}</div></section>`
    }
    function openNorm(draft) { normDraft = draft || null; $('#normBody').innerHTML = normHTML(); if (!$('#norm').open) $('#norm').showModal(); (draft ? $('#nwN') : $('#nwP')).focus() }
    function refreshNorm() { const t = $('#nTest') && $('#nTest').value; $('#normBody').innerHTML = normHTML(); if (t) { $('#nTest').value = t; normTest() } }
    function saveNorm() {
      $('#normSt').textContent = 'Salvando…'; clearTimeout(normTimer);
      normTimer = setTimeout(() => rpc('saveNormalizacoes', NORM).then(() => $('#normSt').textContent = TXT.normSalvas + stamp())
        .catch(e => { $('#normSt').textContent = 'Erro ao salvar: ' + errTxt(e); toast('Erro ao salvar as regras') }), 600);
      reNorm()
    }
    function addNorm() {
      const tipo = $('#nwT').value, padrao = $('#nwP').value.trim(), nome = $('#nwN').value.trim(), categoria = $('#nwC').value;
      if (!padrao || !nome) { toast('Informe o texto da fatura e o nome final'); return }
      if (!nkey(padrao)) { toast('O texto precisa ter letras'); return }
      if (NORM.some(r => r.tipo === tipo && nkey(r.padrao) === nkey(padrao))) { toast('Já existe uma regra igual'); return }
      NORM.push({ id: 'r' + Date.now().toString(36), tipo, padrao, nome, categoria }); normDraft = null;
      saveNorm(); refreshNorm(); toast('Regra criada: ' + nome); $('#nwP').focus()
    }
    function delNorm(id) { NORM = NORM.filter(r => r.id !== id); saveNorm(); refreshNorm() }
    function normTest() {
      const t = $('#nTest').value.trim(), o = $('#nTestR'); if (!t) { o.textContent = ''; return }
      const r = findRule(splitParc(t).base), f = finalName(t);
      o.innerHTML = r ? `→ <b>${esc(f.n)}</b>${f.c ? ' · ' + esc(f.c) : ''} <small>(${NTIPO[r.tipo].toLowerCase()} “${esc(r.padrao)}”)</small>` : `→ ${esc(f.n)} <small>(nenhuma regra)</small>`
    }
    document.addEventListener('change', e => {
      const i = e.target, id = i.dataset.rt || i.dataset.rp || i.dataset.rn || i.dataset.rcat; if (!id) return;
      const r = NORM.find(x => x.id === id); if (!r) return;
      if (i.dataset.rt) r.tipo = i.value;
      else if (i.dataset.rcat !== undefined) r.categoria = i.value;
      else { const f = i.dataset.rp ? 'padrao' : 'nome', v = i.value.trim(); if (!v || (f === 'padrao' && !nkey(v))) { i.value = r[f]; toast('O texto não pode ficar vazio'); return } r[f] = v; i.value = v }
      saveNorm(); if ($('#nTest').value) normTest()
    });
    document.addEventListener('input', e => { if (e.target.id === 'nTest') normTest() });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && ['nwP', 'nwN'].includes(e.target.id)) { e.preventDefault(); addNorm() } });
</script>
