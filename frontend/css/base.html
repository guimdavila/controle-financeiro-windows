<style>
    :root {
      color-scheme: dark;
      --bg: #121110;
      --surface: #1A1917;
      --sunk: #232120;
      --ink: #F1EDE6;
      --muted: #9C968B;
      --faint: #6B665D;
      --line: #33302C;
      --line2: #46423C;
      --accent: #D8AC4E;
      --accent-ink: #2A1E04;
      --in: #74CF9B;
      --out: #E5735F;
      --pos: #6CC893;
      --neg: #F0877B;
      --warn: #E8924A;
      --hl: #3A2F14;
      --disp: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
      --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --side: 236px;
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 var(--body);
      font-variant-numeric: tabular-nums
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    svg.i {
      width: 16px;
      height: 16px;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* ---------- casca: barra lateral + conteúdo ---------- */
    .app {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      min-height: 100vh
    }

    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 14px 14px;
      background: var(--surface);
      border-right: 1px solid var(--line)
    }

    .brand {
      padding: 0 8px
    }

    .brand h1 {
      font: 800 21px/1.1 var(--disp);
      margin: 0;
      letter-spacing: -.015em
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12.5px
    }

    .menu {
      position: relative
    }

    .sel {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left
    }

    .sel:hover {
      border-color: var(--line2)
    }

    .sel small {
      color: var(--muted);
      display: block;
      font-size: 11.5px;
      line-height: 1.1
    }

    .sel b {
      font: 700 16px/1.2 var(--disp)
    }

    .sel .i:last-child {
      margin-left: auto;
      color: var(--muted)
    }

    .pop {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      background: var(--sunk);
      border: 1px solid var(--line2);
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .45)
    }

    .pop.up {
      bottom: calc(100% + 6px)
    }

    .pop.dn {
      top: calc(100% + 6px)
    }

    .pop button {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: center;
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: left
    }

    .pop button:hover {
      background: var(--line)
    }

    .pop button[aria-pressed=true] {
      color: var(--accent);
      font-weight: 600
    }

    .pop button.danger {
      color: var(--neg)
    }

    .pop hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 6px 0
    }

    .pop p {
      margin: 4px 10px 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4
    }

    nav.tabs {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    nav.tabs button {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border: 0;
      background: none;
      border-radius: 8px;
      color: var(--muted);
      text-align: left;
      font-weight: 500;
      white-space: nowrap
    }

    nav.tabs button:hover {
      background: var(--sunk);
      color: var(--ink)
    }

    nav.tabs button[aria-selected=true] {
      background: var(--hl);
      color: var(--ink);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent)
    }

    nav.tabs button[aria-selected=true] .i {
      color: var(--accent)
    }

    .side-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .sync {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 12.5px
    }

    #saved {
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3
    }

    .sync .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--in)
    }

    .sync button {
      margin-left: auto;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      background: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted)
    }

    .sync button:hover {
      color: var(--ink);
      border-color: var(--line2)
    }

    .side-foot .sel b {
      font: 600 14px var(--body)
    }

    .main {
      min-width: 0
    }

    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 32px;
      background: rgba(18, 17, 16, .92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line)
    }

    .bar h2 {
      font: 700 20px/1 var(--disp);
      margin: 0 8px 0 0;
      white-space: nowrap
    }

    #acts {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex: none
    }

    .view {
      padding: 26px 32px 56px
    }

    .months {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px
    }

    .months::-webkit-scrollbar {
      display: none
    }

    .months button {
      border: 1px solid transparent;
      background: none;
      border-radius: 7px;
      padding: 5px 11px;
      color: var(--muted);
      white-space: nowrap
    }

    .months button:hover {
      background: var(--sunk);
      color: var(--ink)
    }

    .months button[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg);
      font-weight: 600
    }

    .months .sep {
      width: 1px;
      background: var(--line);
      margin: 4px 6px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line2);
      background: var(--sunk);
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 500;
      white-space: nowrap
    }

    .btn:hover {
      border-color: var(--accent)
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600
    }

    .btn.primary:hover {
      filter: brightness(1.08)
    }

    .btn.sm {
      padding: 4px 10px;
      font-size: 13px
    }

    .btn.danger {
      color: var(--neg)
    }

    h2 {
      font: 700 18px/1.2 var(--disp);
      margin: 26px 0 10px
    }

    .blk>.hint {
      margin: -4px 0 8px;
      color: var(--muted);
      font-size: 13px
    }

    @media (max-width:1100px) {
      .view {
        padding: 22px 20px 48px
      }

      .bar {
        padding: 12px 20px
      }
    }

    @media (max-width:860px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        position: static;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 12px 16px
      }

      .brand p {
        display: none
      }

      .side .menu {
        flex: 1 1 140px
      }

      nav.tabs {
        flex-direction: row;
        overflow-x: auto;
        order: 3;
        flex: 1 0 100%
      }

      .side-foot {
        margin: 0;
        flex-direction: row;
        align-items: center
      }

      .sync span {
        display: none
      }

      .bar {
        position: static;
        flex-wrap: wrap;
        padding: 10px 16px
      }

      .bar h2 {
        display: none
      }

      #acts {
        margin-left: 0;
        width: 100%
      }

      .view {
        padding: 18px 16px 40px
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

</style>
