<style>
    /* grid */
    .wrap {
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px
    }

    table.grid {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 100%
    }

    .grid th,
    .grid td {
      padding: 0;
      border-bottom: 1px solid var(--line);
      height: 36px;
      white-space: nowrap
    }

    .grid thead th {
      background: var(--sunk);
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      text-align: right;
      padding: 0 10px;
      height: 34px
    }

    .grid thead th:first-child {
      text-align: left
    }

    .grid .lbl {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--surface);
      text-align: left;
      padding: 0 12px;
      min-width: 190px;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
      border-right: 1px solid var(--line)
    }

    .grid thead .lbl {
      background: var(--sunk)
    }

    .grid td,
    .grid th[data-m],
    .grid th.agg {
      min-width: 84px
    }

    .grid td.num {
      text-align: right;
      padding: 0 10px
    }

    .grid input.cell {
      width: 100%;
      height: 35px;
      border: 0;
      background: transparent;
      text-align: right;
      padding: 0 10px;
      border-radius: 0
    }

    .grid input.cell::placeholder {
      color: #9AA5AE;
      opacity: .7
    }

    .grid input.cell:focus {
      background: var(--hl);
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .grid input.cell.expr {
      text-decoration: underline dotted var(--muted);
      text-underline-offset: 4px
    }

    .grid tr.tot td,
    .grid tr.tot .lbl {
      background: var(--sunk);
      font-weight: 700
    }

    .grid tr.big td,
    .grid tr.big .lbl {
      font-weight: 700
    }

    .grid tr.big td.num {
      font-family: var(--disp);
      font-size: 16px
    }

    .grid td.agg {
      background: var(--sunk);
      border-left: 1px solid var(--line);
      color: var(--ink)
    }

    .neg {
      color: var(--neg)
    }

    .grid tr.tot td.pos,
    .pos {
      color: var(--pos)
    }

    button.exp {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 35px;
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
      font-weight: 600
    }

    button.exp svg {
      transition: transform .15s
    }

    button.exp[aria-expanded=true] svg {
      transform: rotate(90deg)
    }

    button.exp .tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 7px
    }

    button.amt {
      width: 100%;
      height: 35px;
      border: 0;
      background: transparent;
      text-align: right;
      padding: 0 10px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
      text-underline-offset: 4px
    }

    button.amt:hover {
      background: var(--hl)
    }

    tr.cardpanel>td,
    tr.lnpanel>td {
      padding: 0;
      border-bottom: 1px solid var(--line);
      background: var(--sunk);
      white-space: normal;
      height: auto
    }

    .panel {
      position: sticky;
      left: 0;
      width: var(--wrapw, 100%);
      padding: 16px 16px 18px;
      border-left: 4px solid var(--accent)
    }

    .ph {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-items: flex-end;
      margin-bottom: 12px
    }

    .ph h3 {
      margin: 0;
      font: 700 17px var(--disp)
    }

    .ph .tot {
      font: 700 30px/1 var(--disp);
      letter-spacing: -.01em
    }

    .ph .sub {
      color: var(--muted);
      font-size: 13px
    }

    .ph .acts {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .pm {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px
    }

    .pm button {
      flex: 0 0 auto;
      min-width: 64px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 4px 8px;
      text-align: left;
      line-height: 1.2
    }

    .pm button b {
      display: block;
      font-size: 13px
    }

    .pm button i {
      display: block;
      font-style: normal;
      font-size: 11px;
      color: var(--muted)
    }

    .pm button[aria-pressed=true] {
      border-color: var(--accent);
      background: var(--hl)
    }

    .seg {
      display: flex;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      gap: 2px;
      background: var(--line);
      margin: 4px 0 12px
    }

    .seg i {
      display: block;
      min-width: 2px
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .tools input[type=search] {
      flex: 1 1 200px;
      max-width: 340px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 10px
    }

    .addrow {
      display: grid;
      grid-template-columns: 90px 1fr 110px 180px auto;
      gap: 8px;
      margin-bottom: 12px;
      background: var(--surface);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--accent)
    }

    .addrow input,
    .addrow select {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 8px;
      min-width: 0
    }

    details.cat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 6px
    }

    details.cat summary {
      display: grid;
      grid-template-columns: 14px minmax(120px, 1.3fr) 70px minmax(80px, 1fr) 100px 48px;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      list-style: none
    }

    details.cat summary::-webkit-details-marker {
      display: none
    }

    details.cat summary:hover {
      background: var(--sunk)
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      display: inline-block
    }

    .cn {
      font-weight: 600
    }

    .cc {
      color: var(--muted);
      font-size: 12px
    }

    .mini {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden
    }

    .mini i {
      display: block;
      height: 100%
    }

    .cv {
      text-align: right;
      font-weight: 600
    }

    .cp {
      text-align: right;
      color: var(--muted);
      font-size: 12px
    }

    .txs {
      border-top: 1px solid var(--line)
    }

    .tx {
      display: grid;
      grid-template-columns: 52px 1fr 170px 104px 30px;
      gap: 8px;
      align-items: center;
      padding: 4px 12px;
      border-bottom: 1px solid var(--line)
    }

    .tx:last-child {
      border-bottom: 0
    }

    .tx .d {
      color: var(--muted);
      font-size: 13px
    }

    .tx .n {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tx select,
    .tx input {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      padding: 3px 6px;
      min-width: 0;
      width: 100%
    }

    .tx select:hover,
    .tx input:hover,
    .tx select:focus,
    .tx input:focus {
      border-color: var(--line);
      background: var(--surface)
    }

    .tx input.v {
      text-align: right
    }

    .tx .x {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      border-radius: 6px
    }

    .tx .x:hover {
      color: var(--neg);
      background: var(--sunk)
    }

    .tag-auto {
      font-size: 11px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0 6px;
      margin-left: 6px
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: 8px
    }

    /* linhas próprias (mês a mês) */
    .lblwrap {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 35px;
      margin: 0 -6px
    }

    .lblin {
      flex: 1;
      min-width: 0;
      height: 29px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      padding: 0 6px;
      font: inherit
    }

    .lblin:hover,
    .lblin:focus {
      border-color: var(--line);
      background: var(--sunk)
    }

    .lblwrap .x {
      flex: 0 0 auto;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      border-radius: 6px;
      padding: 2px 6px;
      opacity: .55
    }

    .lblwrap .x:hover {
      color: var(--neg);
      background: var(--sunk);
      opacity: 1
    }

    .grid tr.addln .lbl {
      padding: 0 8px
    }

    .grid tr.addln td {
      background: var(--surface)
    }

    .lnf {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 220px) auto auto auto;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--accent)
    }

    .lnf.ent {
      grid-template-columns: minmax(160px, 1fr) auto auto
    }

    .lnf input,
    .lnf select {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 8px;
      min-width: 0
    }

    .lnp {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: normal
    }

</style>
