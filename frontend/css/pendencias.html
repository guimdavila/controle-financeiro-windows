<style>
    /* pendencias */
    .list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }

    .li {
      display: grid;
      grid-template-columns: 28px minmax(120px, 1fr) 130px 30px;
      gap: 8px;
      align-items: center;
      padding: 4px 12px;
      border-bottom: 1px solid var(--line)
    }

    .li.n {
      grid-template-columns: 28px 1fr 30px
    }

    .li input[type=text],
    .li input.money {
      border: 1px solid transparent;
      background: transparent;
      padding: 5px 6px;
      border-radius: 6px;
      width: 100%;
      min-width: 0
    }

    .li input.money {
      text-align: right
    }

    .li input:hover,
    .li input:focus {
      border-color: var(--line);
      background: var(--sunk)
    }

    .li.done input[type=text] {
      text-decoration: line-through;
      color: var(--muted)
    }

    .li .x {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 18px
    }

    .li .x:hover {
      color: var(--neg)
    }

    .lsum {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: var(--sunk);
      font-weight: 600
    }

    .lsum span small {
      display: block;
      font-weight: 400;
      color: var(--muted)
    }

    .foot {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .foot p {
      margin: 0;
      flex: 1 1 320px
    }

    dialog {
      border: 1px solid var(--line2);
      border-radius: 16px;
      background: var(--bg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      color: var(--ink);
      padding: 0;
      width: min(760px, 94vw);
      max-height: 90vh
    }

    dialog::backdrop {
      background: rgba(4, 8, 10, .72);
      backdrop-filter: blur(3px)
    }

    .dlg {
      display: flex;
      flex-direction: column;
      max-height: 90vh
    }

    .dlg header {
      padding: 16px 18px 8px
    }

    .dlg header h3 {
      margin: 0;
      font: 700 19px var(--disp)
    }

    .dlg header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .dlg .body {
      padding: 8px 18px;
      overflow: auto
    }

    .dlg .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .dlg label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 3px
    }

    .dlg textarea {
      width: 100%;
      height: 96px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--sunk);
      padding: 8px;
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace
    }

    .dlg select {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 8px
    }

    .dlg footer {
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center
    }

    .dlg footer .s {
      margin-right: auto;
      font-size: 13px;
      color: var(--muted)
    }

    .prev {
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 300px;
      overflow: auto
    }

    .prev .tx {
      grid-template-columns: 52px 1fr 170px 90px 30px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 50;
      top: auto;
      right: auto;
      margin: 0;
      border: 0;
      width: max-content;
      max-width: 90vw;
      height: auto;
      overflow: visible
    }

    .toast.on {
      opacity: 1
    }

    [hidden] {
      display: none !important
    }

</style>
