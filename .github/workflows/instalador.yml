# Gera o instalador do Windows (.exe).
# Roda à mão (Actions > Instalador > Run workflow) ou ao criar uma tag v*.
# O arquivo fica em "Artifacts" na página da execução.
name: Instalador

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:dist:win
        env:
          # sem certificado: o instalador sai sem assinatura (o sistema avisa ao abrir)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Controle financeiro $GITHUB_REF_NAME" --notes "Instalador para Windows (.exe). Sem assinatura digital: veja o README para o aviso na primeira abertura."
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
